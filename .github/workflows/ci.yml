name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan source history for secrets
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner .
          python3 scripts/audit-public-files.py
      - name: Test
        run: swift test
      - name: Build universal app without release credentials
        run: ./scripts/build-app.sh --mode unsigned
      - name: Verify bundle policy
        run: python3 scripts/verify-bundle.py --allow-unsigned
